[project]
name = "order-disorder-family-trees"
version = "0.1.0"
description = "Benchmarking utilities for SWORD order-disorder family-tree analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
  "SWORDlib==0.1.1",
  "pandarallel==1.6.5",
  "pandas==2.2.3",
  "pymatgen==2024.11.13",
]

[dependency-groups]
test = ["pytest==8.3.5"]
lint = ["ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
